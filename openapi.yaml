openapi: 3.1.0
info:
  title: AdPilot API
  version: 2.0.0
  description: Statistical anomaly replay plus a live Workers AI investigation loop for INC-2407.
servers:
  - url: https://adpilot-ai-ops.kaiying-coder.workers.dev
paths:
  /api/metrics:
    get:
      summary: Query campaign metrics
      parameters:
        - { name: market, in: query, schema: { type: string, enum: [All, US, DE, UK], default: All } }
        - { name: device, in: query, schema: { type: string, enum: [All, Mobile, Desktop], default: All } }
      responses:
        "200":
          description: Filtered rows, summary metrics, and a 14-day trend
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MetricsResponse" }
  /api/anomalies:
    get:
      summary: List statistically detected anomalies and replay disclosure
      responses:
        "200": { description: Detected incidents, thresholds, and replay trade-offs }
  /api/anomalies/scan:
    post:
      summary: Inject a new anomaly into an in-memory copy and scan all 84 rows
      responses:
        "200": { description: Detection result for the previously unseen input }
        "400": { description: Invalid injection request }
  /api/investigations/{id}:
    get:
      summary: Read an investigation workflow and auditable tool trace
      parameters:
        - { $ref: "#/components/parameters/IncidentId" }
      responses:
        "200": { description: Investigation state machine and evidence }
        "404": { description: Incident not found }
  /api/investigations/{id}/approve:
    post:
      summary: Approve a simulated response action
      description: No external advertising system is modified.
      parameters:
        - { $ref: "#/components/parameters/IncidentId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, const: approve }
      responses:
        "200": { description: Approval audit record and simulated execution }
        "400": { description: Explicit approval was not supplied }
        "404": { description: Incident not found }
  /api/investigations/{id}/run:
    post:
      summary: Run the live Workers AI tool loop for INC-2407
      description: The model chooses read-only tools, receives computed observations, and returns a recommendation behind human approval.
      parameters:
        - { $ref: "#/components/parameters/IncidentId" }
      responses:
        "200": { description: Model, decision trace, tool observations, conclusion, confidence, and guardrail }
        "400": { description: Live LLM scope is limited to INC-2407 }
        "502": { description: Workers AI inference failed and can be retried }
  /api/knowledge:
    get:
      summary: Search approved runbooks and historical cases
      parameters:
        - { name: q, in: query, schema: { type: string, example: latency } }
      responses:
        "200": { description: Ranked passages with document citations }
  /api/analyst/ask:
    post:
      summary: Ask the grounded Workers AI monetization analyst
      description: Uses current filters, computed 14-day metrics, detected incidents, and approved knowledge. Public calls are rate limited and identical questions are briefly cached.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question: { type: string, maxLength: 300 }
                market: { type: string, enum: [All, US, DE, UK], default: All }
                device: { type: string, enum: [All, Mobile, Desktop], default: All }
                language: { type: string, enum: [zh, en], default: zh }
      responses:
        "200": { description: Grounded model answer, filters, sources, usage, and cache status }
        "400": { description: Invalid question }
        "429": { description: Public demo rate limit reached }
        "502": { description: Workers AI inference failed }
  /api/evaluations:
    get:
      summary: Read detector, retrieval, agent, latency, and cost evaluations
      responses:
        "200": { description: Reproducible evaluation report }
components:
  parameters:
    IncidentId:
      name: id
      in: path
      required: true
      schema: { type: string, enum: [INC-2407, INC-2406, INC-2405] }
  schemas:
    MetricsResponse:
      type: object
      required: [filters, rowCount, summary, trend]
      properties:
        filters:
          type: object
          properties:
            market: { type: string }
            device: { type: string }
        rowCount: { type: integer }
        summary:
          type: object
          properties:
            revenue: { type: number }
            spend: { type: number }
            ctr: { type: number }
            cvr: { type: number }
            roas: { type: number }
        trend:
          type: array
          items:
            type: object
            properties:
              date: { type: string }
              value: { type: number }
